          mkdir -p $(dirname app/src/main/res/drawable/widget_bg.xml)
          cat > app/src/main/res/drawable/widget_bg.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="315" android:startColor="#FF000000" android:endColor="#FF8A0000" />
              <corners android:radius="28dp" />
          </shape>
          EOF_FILE
          mkdir -p $(dirname app/src/main/res/layout/widget_cutout.xml)
          cat > app/src/main/res/layout/widget_cutout.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg"
              android:padding="6dp">
              <ImageView
                  android:id="@+id/cutout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:src="@drawable/ic_launcher"
                  android:scaleType="fitCenter" />
              <TextClock
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top|start"
                  android:layout_margin="10dp"
                  android:format12Hour="hh:mm"
                  android:format24Hour="HH:mm"
                  android:textColor="#FFFFFF"
                  android:textSize="30sp"
                  android:fontFamily="sans-serif-light"
                  android:shadowColor="#99000000"
                  android:shadowRadius="6" />
          </FrameLayout>
          EOF_FILE
          mkdir -p $(dirname app/src/main/res/values/themes.xml)
          cat > app/src/main/res/values/themes.xml <<'EOF_FILE'
          <resources>
              <style name="Theme.App" parent="android:Theme.Material.Wallpaper.NoTitleBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF_FILE
          mkdir -p $(dirname app/src/main/res/xml/cutout_widget.xml)
          cat > app/src/main/res/xml/cutout_widget.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="180dp"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/widget_cutout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF_FILE
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF_FILE
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF_FILE
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AestheticLauncher"
          include(":app")
          EOF_FILE
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: AestheticLauncher-APK, path: app/build/outputs/apk/debug/app-debug.apk }
